<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick War Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #90EE90 50%, #228B22 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            border: 2px solid #333;
            background: transparent;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 18px;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        .unit-btn {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: 2px solid #2E7D32;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .unit-btn:hover {
            background: #66BB6A;
            transform: scale(1.05);
        }
        
        .unit-btn:disabled {
            background: #9E9E9E;
            cursor: not-allowed;
            transform: none;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        #restartBtn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>💰 Золото: <span id="gold">100</span></div>
        <div>🏰 Здоровье базы: <span id="baseHealth">1000</span></div>
        <div>☠️ Врагов убито: <span id="kills">0</span></div>
        <div style="margin-top: 10px; color: #FFB6C1;">💀 Золото врага: <span id="enemyGold">100</span></div>
        <div style="margin-top: 5px; color: #FF6347;">💀 Здоровье базы врага: <span id="enemyBaseHealthDisplay">1000</span></div>
    </div>
    
    <canvas id="gameCanvas" width="1200" height="600"></canvas>
    
    <div id="controls">
        <button class="unit-btn" onclick="spawnUnit('miner')">⛏️ Шахтёр (50💰)</button>
        <button class="unit-btn" onclick="spawnUnit('swordman')">⚔️ Мечник (100💰)</button>
        <button class="unit-btn" onclick="spawnUnit('archer')">🏹 Лучник (150💰)</button>
        <button class="unit-btn" onclick="spawnUnit('giant')">🗿 Гигант (300💰)</button>
    </div>
    
    <div id="modeControls" style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px;">
        <button id="defendBtn" class="unit-btn" onclick="setMode('defend')" style="background: #2196F3; border-color: #1976D2;">🛡️ Защита</button>
        <button id="attackBtn" class="unit-btn" onclick="setMode('attack')" style="background: #f44336; border-color: #d32f2f;">⚔️ Атака</button>
    </div>
    
    <div id="gameOver">
        <h1 id="gameOverText">GAME OVER</h1>
        <button id="restartBtn" onclick="restartGame()">Играть снова</button>
    </div>

    <script src="game.js"></script>
    <script>
        // Mode toggle functions
        function setMode(mode) {
            gameMode = mode;
            document.getElementById('defendBtn').style.background = mode === 'defend' ? '#2196F3' : '#9E9E9E';
            document.getElementById('attackBtn').style.background = mode === 'attack' ? '#f44336' : '#9E9E9E';
        }
        
        // Initialize button states
        setMode('defend');
    </script>
</body>
</html>
